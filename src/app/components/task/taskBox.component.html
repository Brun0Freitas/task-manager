<div *ngIf="tasks.length > 0; else noTasks">
    <ul>
        <li *ngFor="let task of tasks">
            <input 
                id="taskCheckbox"
                type="checkbox" 
                [(ngModel)]="task.isCompleted"
                (change)="toggleCompletion(task)">
            <span>{{ task.text }}</span>
        </li>
    </ul>
</div>

<ng-template #noTasks>
    <p>There are no tasks to display.</p>
</ng-template>
